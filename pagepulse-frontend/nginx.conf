server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets normally; fall back to index.html for any
    # path that doesn't match a real file, so client-side routing
    # (if added later) works correctly on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively — Vite/CRA fingerprint
    # filenames on build, so this is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
